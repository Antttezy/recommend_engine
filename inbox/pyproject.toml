[project]
name = "inbox"
dynamic = ["version"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "confluent-kafka>=2.14.0",
    "core",
    "grpcio>=1.80.0",
    "infrastructure",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.13.1",
]

[tool.uv.sources]
core = {workspace = true}
infrastructure = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
