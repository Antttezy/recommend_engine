[tool.uv.workspace]
members = [
    "api",
    "core",
    "inbox",
    "infrastructure",
    "migrator",
    "feed",
    "swipe_feedback",
    "tests",
    "vector_processor"
]

[tool.coverage.run]
omit = [
    # Test files
    "*/test_*.py",
    "tests/*",

    # Protobuf generated files
    "*_pb2*",

    # Entrypoints
    "*/main.py",
    "vector_processor/prepare_models.py"
]
