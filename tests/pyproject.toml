[project]
name = "tests"
dynamic = ["version"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "pillow>=12.2.0"
]

[tool.uv.sources]
core = {workspace = true}

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0"
]
