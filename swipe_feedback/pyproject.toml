[project]
name = "swipe-feedback"
dynamic = ["version"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "infrastructure",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "uvicorn>=0.46.0",
]

[tool.uv.sources]
core = {workspace = true}
infrastructure = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
