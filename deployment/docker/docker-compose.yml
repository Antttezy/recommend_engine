services:
  kafka:
    image: apache/kafka:${KAFKA_VER:-latest}
    ports:
      - 9092:19092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DEV://:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DEV:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,DEV://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/tmp/kafka-logs:rw
  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VER:-latest}
    ports:
      - 9080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
  qdrant:
    image: qdrant/qdrant:${QDRANT_VER:-latest-unprivileged}
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - qdrant_data:/qdrant/storage:rw
  valkey:
    image: valkey/valkey:${VALKEY_VER:-latest}
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data:rw
  insight:
    image: redislabs/redisinsight:${REDIS_INSIGHT_VER:-latest}
    ports:
      - 5540:5540
    environment:
      - RI_REDIS_HOST=valkey
    depends_on:
      - valkey

volumes:
  kafka_data:
  qdrant_data:
  valkey_data:
