[project]
name = "infrastructure"
dynamic = ["version"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "api",
    "core",
    "grpcio>=1.80.0",
    "pillow>=12.2.0",
    "qdrant-client>=1.17.1",
]

[tool.uv.sources]
core = { workspace = true }
api = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
